<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 170" width="100%" height="100%">
  <defs>
    <style>
      .font-pixel {
        font-family: 'Courier New', Courier, monospace;
        shape-rendering: crispEdges;
      }
      .tag-box {
        fill: #202C3D;
        stroke: #35465B;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="0" y="0" width="280" height="170" fill="#151B26" stroke="#35465B" stroke-width="1.5" rx="2" shape-rendering="crispEdges"/>
  
  <!-- Title bar -->
  <rect x="1" y="1" width="278" height="24" fill="#1C2635" shape-rendering="crispEdges"/>
  <line x1="1" y1="25" x2="279" y2="25" stroke="#35465B" stroke-width="1"/>
  <rect x="8" y="7" width="9" height="9" fill="#9D8EC2" shape-rendering="crispEdges"/>
  <text x="22" y="17" fill="#EAE5D9" class="font-pixel" font-size="9.5" font-weight="bold">SIGNOVA.EXE</text>
  <text x="238" y="17" fill="#94A3B8" class="font-pixel" font-size="8.5">_ □ ×</text>

  <!-- Pixel Art Scene Banner (ISL hand landmark spatial tracking & speech bubble) -->
  <g transform="translate(6, 28)">
    <rect x="0" y="0" width="268" height="54" fill="#1C2635" shape-rendering="crispEdges"/>
    <!-- Articulated Pixel Hand -->
    <g transform="translate(26, 8)">
      <!-- Palm -->
      <rect x="6" y="24" width="22" height="16" fill="#F29E85" rx="1"/>
      <!-- Fingers with joint landmarks -->
      <line x1="9" y1="24" x2="9" y2="10" stroke="#F29E85" stroke-width="2.5"/>
      <line x1="14" y1="24" x2="14" y2="6" stroke="#F29E85" stroke-width="2.5"/>
      <line x1="19" y1="24" x2="19" y2="8" stroke="#F29E85" stroke-width="2.5"/>
      <line x1="24" y1="24" x2="24" y2="12" stroke="#F29E85" stroke-width="2.5"/>
      <!-- Thumb -->
      <line x1="6" y1="28" x2="1" y2="22" stroke="#F29E85" stroke-width="2.5"/>
      
      <!-- Keypoint Landmark dots -->
      <circle cx="9" cy="10" r="1.5" fill="#4BA3A3"/>
      <circle cx="14" cy="6" r="1.5" fill="#4BA3A3"/>
      <circle cx="19" cy="8" r="1.5" fill="#4BA3A3"/>
      <circle cx="24" cy="12" r="1.5" fill="#4BA3A3"/>
      <circle cx="1" cy="22" r="1.5" fill="#4BA3A3"/>
    </g>

    <!-- Translated Speech Bubble -->
    <g transform="translate(62, 14)">
      <rect x="0" y="0" width="30" height="18" fill="#202C3D" stroke="#35465B" stroke-width="1" rx="2"/>
      <text x="6" y="12" fill="#EAE5D9" class="font-pixel" font-size="8">"HELLO"</text>
      <!-- Tail -->
      <polygon points="4,18 8,18 4,22" fill="#202C3D"/>
    </g>

    <!-- Scene Tag -->
    <text x="105" y="24" fill="#9D8EC2" class="font-pixel" font-size="8">ISL TRANSLATION</text>
    <text x="105" y="38" fill="#EAE5D9" class="font-pixel" font-size="9" font-weight="bold">SIGN-TO-SPEECH MODEL</text>
  </g>

  <!-- Project Info -->
  <text x="12" y="98" fill="#EAE5D9" class="font-pixel" font-size="12" font-weight="bold">SIGNOVA ↗</text>
  <text x="12" y="112" fill="#94A3B8" class="font-pixel" font-size="8.5">Continuous Indian Sign Language</text>
  <text x="12" y="124" fill="#94A3B8" class="font-pixel" font-size="8.5">translation via temporal gesture models.</text>

  <!-- Tech tags -->
  <g transform="translate(12, 138)">
    <rect class="tag-box" x="0" y="0" width="74" height="18"/>
    <text x="7" y="12" fill="#4BA3A3" class="font-pixel" font-size="8.5">MediaPipe</text>

    <rect class="tag-box" x="80" y="0" width="56" height="18"/>
    <text x="88" y="12" fill="#9D8EC2" class="font-pixel" font-size="8.5">PyTorch</text>

    <rect class="tag-box" x="142" y="0" width="56" height="18"/>
    <text x="150" y="12" fill="#F29E85" class="font-pixel" font-size="8.5">OpenCV</text>
  </g>
</svg>
