<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 44" width="100%" height="100%">
  <defs>
    <style>
      .font-pixel {
        font-family: 'Courier New', Courier, monospace;
        shape-rendering: crispEdges;
      }
    </style>
  </defs>
  <!-- Window Outer -->
  <rect x="2" y="2" width="876" height="40" fill="#0b0e14" rx="2" shape-rendering="crispEdges"/>
  <rect x="0" y="0" width="876" height="40" fill="#151b26" stroke="#2c3a4f" stroke-width="2" rx="2" shape-rendering="crispEdges"/>
  
  <!-- Content -->
  <rect x="12" y="11" width="18" height="18" fill="#1e2736" stroke="#364964" stroke-width="1"/>
  <circle cx="21" cy="20" r="4" fill="#4ba3a3"/>

  <text x="38" y="25" fill="#eae5d9" class="font-pixel" font-size="12" font-weight="bold">TELEMETRY.SYS</text>
  <text x="160" y="25" fill="#9d8ec2" class="font-pixel" font-size="10.5">// LIVE GITHUB METRICS &amp; ACTIVITY LOG</text>
  <text x="560" y="25" fill="#4ba3a3" class="font-pixel" font-size="9.5">● SYNCED WITH GITHUB API</text>

  <!-- Window controls -->
  <text x="830" y="25" fill="#8795a8" class="font-pixel" font-size="10">_ □ ×</text>
</svg>
