<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="100%" height="100%">
  <defs>
    <style>
      .font-pixel {
        font-family: 'Courier New', Courier, monospace;
        shape-rendering: crispEdges;
      }
      @keyframes eq1 { 0%, 100% { height: 6px; } 50% { height: 22px; } }
      @keyframes eq2 { 0%, 100% { height: 18px; } 50% { height: 8px; } }
      @keyframes eq3 { 0%, 100% { height: 12px; } 50% { height: 26px; } }
      @keyframes eq4 { 0%, 100% { height: 24px; } 50% { height: 14px; } }
      @keyframes eq5 { 0%, 100% { height: 10px; } 50% { height: 20px; } }
      .bar-1 { animation: eq1 0.8s ease-in-out infinite; }
      .bar-2 { animation: eq2 1.1s ease-in-out infinite; }
      .bar-3 { animation: eq3 0.7s ease-in-out infinite; }
      .bar-4 { animation: eq4 0.9s ease-in-out infinite; }
      .bar-5 { animation: eq5 1.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- LEFT WINDOW: NOW_PLAYING.EXE (Width 430) -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="430" height="144" fill="#0b0e14" rx="2" shape-rendering="crispEdges"/>
    <rect x="0" y="0" width="430" height="144" fill="#151b26" stroke="#2c3a4f" stroke-width="2" rx="2" shape-rendering="crispEdges"/>
    
    <!-- Title bar -->
    <rect x="2" y="2" width="426" height="24" fill="#1c2536" shape-rendering="crispEdges"/>
    <line x1="2" y1="26" x2="428" y2="26" stroke="#2c3a4f" stroke-width="1.5"/>
    <rect x="8" y="7" width="10" height="10" fill="#f29e85" shape-rendering="crispEdges"/>
    <text x="24" y="18" fill="#eae5d9" class="font-pixel" font-size="10" font-weight="bold">NOW_PLAYING.EXE</text>
    <text x="395" y="17" fill="#8795a8" class="font-pixel" font-size="9">_ □ ×</text>

    <!-- Player Body -->
    <g transform="translate(16, 40)">
      <!-- Pixel Album Art Mini Thumbnail -->
      <rect x="0" y="0" width="48" height="48" fill="#1f2838" stroke="#364964" stroke-width="1" shape-rendering="crispEdges"/>
      <polygon points="12,36 24,18 36,36" fill="#4ba3a3"/>
      <polygon points="26,36 34,24 42,36" fill="#9d8ec2"/>
      <circle cx="36" cy="14" r="4" fill="#f29e85"/>

      <!-- Track Info -->
      <text x="60" y="18" fill="#eae5d9" class="font-pixel" font-size="12" font-weight="bold">The Nights</text>
      <text x="60" y="34" fill="#f29e85" class="font-pixel" font-size="10">Avicii</text>
      <text x="60" y="47" fill="#8795a8" class="font-pixel" font-size="8.5">"One day you'll leave this world behind..."</text>

      <!-- Equalizer Bars -->
      <g transform="translate(350, 48)">
        <rect class="bar-1" x="0" y="-15" width="4" height="15" fill="#4ba3a3" shape-rendering="crispEdges"/>
        <rect class="bar-2" x="7" y="-15" width="4" height="15" fill="#5fb3ab" shape-rendering="crispEdges"/>
        <rect class="bar-3" x="14" y="-15" width="4" height="15" fill="#f29e85" shape-rendering="crispEdges"/>
        <rect class="bar-4" x="21" y="-15" width="4" height="15" fill="#9d8ec2" shape-rendering="crispEdges"/>
        <rect class="bar-5" x="28" y="-15" width="4" height="15" fill="#4ba3a3" shape-rendering="crispEdges"/>
      </g>

      <!-- Progress Bar -->
      <g transform="translate(0, 62)">
        <rect x="0" y="0" width="398" height="5" fill="#101520" stroke="#232d3d" stroke-width="1"/>
        <rect x="1" y="1" width="280" height="3" fill="#4ba3a3"/>
        <text x="0" y="17" fill="#8795a8" class="font-pixel" font-size="8.5">02:14</text>
        <text x="370" y="17" fill="#8795a8" class="font-pixel" font-size="8.5">02:56</text>
        
        <!-- Controls -->
        <g transform="translate(170, 10)">
          <text x="0" y="10" fill="#eae5d9" class="font-pixel" font-size="11">|◄</text>
          <text x="24" y="10" fill="#f29e85" class="font-pixel" font-size="11">►</text>
          <text x="46" y="10" fill="#eae5d9" class="font-pixel" font-size="11">►|</text>
        </g>
      </g>
    </g>
  </g>

  <!-- RIGHT WINDOW: FIND_ME_HERE.EXE (Width 436) -->
  <g transform="translate(444, 0)">
    <rect x="2" y="2" width="436" height="144" fill="#0b0e14" rx="2" shape-rendering="crispEdges"/>
    <rect x="0" y="0" width="436" height="144" fill="#151b26" stroke="#2c3a4f" stroke-width="2" rx="2" shape-rendering="crispEdges"/>
    
    <!-- Title bar -->
    <rect x="2" y="2" width="432" height="24" fill="#1c2536" shape-rendering="crispEdges"/>
    <line x1="2" y1="26" x2="434" y2="26" stroke="#2c3a4f" stroke-width="1.5"/>
    <rect x="8" y="7" width="10" height="10" fill="#9d8ec2" shape-rendering="crispEdges"/>
    <text x="24" y="18" fill="#eae5d9" class="font-pixel" font-size="10" font-weight="bold">FIND_ME_HERE.EXE // NET_COMMS</text>
    <text x="400" y="17" fill="#8795a8" class="font-pixel" font-size="9">_ □ ×</text>

    <!-- Contacts list -->
    <g transform="translate(16, 40)">
      <!-- GitHub -->
      <rect x="0" y="0" width="18" height="18" fill="#202a3a" stroke="#364964" stroke-width="1"/>
      <text x="4" y="13" fill="#eae5d9" class="font-pixel" font-size="10">GH</text>
      <text x="26" y="13" fill="#9d8ec2" class="font-pixel" font-size="10">GitHub</text>
      <text x="120" y="13" fill="#eae5d9" class="font-pixel" font-size="10">: /Guruprasad-Bhosale</text>

      <!-- LinkedIn -->
      <rect x="0" y="26" width="18" height="18" fill="#202a3a" stroke="#364964" stroke-width="1"/>
      <text x="4" y="39" fill="#4ba3a3" class="font-pixel" font-size="10">IN</text>
      <text x="26" y="39" fill="#4ba3a3" class="font-pixel" font-size="10">LinkedIn</text>
      <text x="120" y="39" fill="#eae5d9" class="font-pixel" font-size="10">: /in/guruprasad-bhosale</text>

      <!-- Email -->
      <rect x="0" y="52" width="18" height="18" fill="#202a3a" stroke="#364964" stroke-width="1"/>
      <text x="4" y="65" fill="#f29e85" class="font-pixel" font-size="10">@</text>
      <text x="26" y="65" fill="#f29e85" class="font-pixel" font-size="10">Email</text>
      <text x="120" y="65" fill="#eae5d9" class="font-pixel" font-size="10">: guruprasadb@gmail.com</text>

      <!-- Dispatch button / ping -->
      <rect x="270" y="6" width="124" height="26" fill="#1b2434" stroke="#4ba3a3" stroke-width="1" shape-rendering="crispEdges"/>
      <text x="282" y="23" fill="#4ba3a3" class="font-pixel" font-size="9" font-weight="bold">PING SIGNAL: 24ms</text>
    </g>
  </g>
</svg>
