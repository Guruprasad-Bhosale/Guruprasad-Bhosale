<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="100%" height="100%">
  <defs>
    <style>
      .font-pixel {
        font-family: 'Courier New', Courier, monospace;
        shape-rendering: crispEdges;
      }
      .slot {
        fill: #161c28;
        stroke: #2a374c;
        stroke-width: 1.5;
      }
      .slot:hover {
        fill: #1b2434;
        stroke: #4ba3a3;
      }
    </style>
  </defs>

  <!-- Outer Shadow & Window -->
  <rect x="2" y="2" width="876" height="186" fill="#0b0e14" rx="2" shape-rendering="crispEdges"/>
  <rect x="0" y="0" width="876" height="186" fill="#141924" stroke="#2c3a4f" stroke-width="2" rx="2" shape-rendering="crispEdges"/>

  <!-- Title bar -->
  <rect x="2" y="2" width="872" height="24" fill="#1c2536" shape-rendering="crispEdges"/>
  <line x1="2" y1="26" x2="874" y2="26" stroke="#2c3a4f" stroke-width="1.5"/>
  <rect x="10" y="7" width="10" height="10" fill="#4ba3a3" shape-rendering="crispEdges"/>
  <text x="26" y="18" fill="#eae5d9" class="font-pixel" font-size="10" font-weight="bold">INVENTORY.EXE // EQUIPPED TECH &amp; SPELLBOOK</text>
  <text x="835" y="17" fill="#8795a8" class="font-pixel" font-size="9">_ □ ×</text>

  <!-- Grid of 8 Equip Slots (2 rows of 4) -->
  <g transform="translate(18, 38)">
    <!-- ROW 1 -->
    <!-- Slot 1: Python -->
    <g transform="translate(0, 0)">
      <rect class="slot" x="0" y="0" width="200" height="62"/>
      <rect x="8" y="8" width="28" height="28" fill="#1d2638" stroke="#364964" stroke-width="1"/>
      <text x="14" y="26" fill="#4ba3a3" class="font-pixel" font-size="14" font-weight="bold">Py</text>
      <text x="44" y="21" fill="#eae5d9" class="font-pixel" font-size="11" font-weight="bold">Python</text>
      <text x="44" y="33" fill="#f29e85" class="font-pixel" font-size="8.5">LEVEL 90 // CORE</text>
      <rect x="8" y="44" width="184" height="4" fill="#0f141d"/>
      <rect x="8" y="44" width="165" height="4" fill="#4ba3a3"/>
      <text x="8" y="56" fill="#75869c" class="font-pixel" font-size="7.5">ML, Automation, Scripting</text>
    </g>

    <!-- Slot 2: TypeScript / JS -->
    <g transform="translate(214, 0)">
      <rect class="slot" x="0" y="0" width="200" height="62"/>
      <rect x="8" y="8" width="28" height="28" fill="#1d2638" stroke="#364964" stroke-width="1"/>
      <text x="14" y="26" fill="#9d8ec2" class="font-pixel" font-size="13" font-weight="bold">TS</text>
      <text x="44" y="21" fill="#eae5d9" class="font-pixel" font-size="11" font-weight="bold">TypeScript / JS</text>
      <text x="44" y="33" fill="#b3a5d0" class="font-pixel" font-size="8.5">LEVEL 85 // CORE</text>
      <rect x="8" y="44" width="184" height="4" fill="#0f141d"/>
      <rect x="8" y="44" width="156" height="4" fill="#9d8ec2"/>
      <text x="8" y="56" fill="#75869c" class="font-pixel" font-size="7.5">Type-safe full-stack apps</text>
    </g>

    <!-- Slot 3: Computer Vision -->
    <g transform="translate(428, 0)">
      <rect class="slot" x="0" y="0" width="200" height="62"/>
      <rect x="8" y="8" width="28" height="28" fill="#1d2638" stroke="#364964" stroke-width="1"/>
      <text x="12" y="26" fill="#f29e85" class="font-pixel" font-size="13" font-weight="bold">CV</text>
      <text x="44" y="21" fill="#eae5d9" class="font-pixel" font-size="11" font-weight="bold">OpenCV / MediaPipe</text>
      <text x="44" y="33" fill="#f29e85" class="font-pixel" font-size="8.5">LEVEL 88 // VISION</text>
      <rect x="8" y="44" width="184" height="4" fill="#0f141d"/>
      <rect x="8" y="44" width="160" height="4" fill="#f29e85"/>
      <text x="8" y="56" fill="#75869c" class="font-pixel" font-size="7.5">Spatial UI, Gestures, Tracking</text>
    </g>

    <!-- Slot 4: AI & Deep Learning -->
    <g transform="translate(642, 0)">
      <rect class="slot" x="0" y="0" width="200" height="62"/>
      <rect x="8" y="8" width="28" height="28" fill="#1d2638" stroke="#364964" stroke-width="1"/>
      <text x="12" y="26" fill="#4ba3a3" class="font-pixel" font-size="13" font-weight="bold">AI</text>
      <text x="44" y="21" fill="#eae5d9" class="font-pixel" font-size="11" font-weight="bold">PyTorch / TensorFlow</text>
      <text x="44" y="33" fill="#4ba3a3" class="font-pixel" font-size="8.5">LEVEL 82 // NEURAL</text>
      <rect x="8" y="44" width="184" height="4" fill="#0f141d"/>
      <rect x="8" y="44" width="150" height="4" fill="#4ba3a3"/>
      <text x="8" y="56" fill="#75869c" class="font-pixel" font-size="7.5">Deep models, Embeddings, Agents</text>
    </g>

    <!-- ROW 2 -->
    <!-- Slot 5: React & Next.js -->
    <g transform="translate(0, 72)">
      <rect class="slot" x="0" y="0" width="200" height="62"/>
      <rect x="8" y="8" width="28" height="28" fill="#1d2638" stroke="#364964" stroke-width="1"/>
      <text x="12" y="26" fill="#4ba3a3" class="font-pixel" font-size="13" font-weight="bold">NX</text>
      <text x="44" y="21" fill="#eae5d9" class="font-pixel" font-size="11" font-weight="bold">React &amp; Next.js</text>
      <text x="44" y="33" fill="#5fb3ab" class="font-pixel" font-size="8.5">LEVEL 85 // FRONTEND</text>
      <rect x="8" y="44" width="184" height="4" fill="#0f141d"/>
      <rect x="8" y="44" width="155" height="4" fill="#4ba3a3"/>
      <text x="8" y="56" fill="#75869c" class="font-pixel" font-size="7.5">SSR, Modern UI, State Systems</text>
    </g>

    <!-- Slot 6: Backend & APIs -->
    <g transform="translate(214, 72)">
      <rect class="slot" x="0" y="0" width="200" height="62"/>
      <rect x="8" y="8" width="28" height="28" fill="#1d2638" stroke="#364964" stroke-width="1"/>
      <text x="12" y="26" fill="#9d8ec2" class="font-pixel" font-size="13" font-weight="bold">AP</text>
      <text x="44" y="21" fill="#eae5d9" class="font-pixel" font-size="11" font-weight="bold">FastAPI &amp; Node.js</text>
      <text x="44" y="33" fill="#9d8ec2" class="font-pixel" font-size="8.5">LEVEL 84 // SERVERS</text>
      <rect x="8" y="44" width="184" height="4" fill="#0f141d"/>
      <rect x="8" y="44" width="154" height="4" fill="#9d8ec2"/>
      <text x="8" y="56" fill="#75869c" class="font-pixel" font-size="7.5">Async REST, Microservices</text>
    </g>

    <!-- Slot 7: Databases & Cache -->
    <g transform="translate(428, 72)">
      <rect class="slot" x="0" y="0" width="200" height="62"/>
      <rect x="8" y="8" width="28" height="28" fill="#1d2638" stroke="#364964" stroke-width="1"/>
      <text x="12" y="26" fill="#f29e85" class="font-pixel" font-size="13" font-weight="bold">DB</text>
      <text x="44" y="21" fill="#eae5d9" class="font-pixel" font-size="11" font-weight="bold">Postgres &amp; Mongo</text>
      <text x="44" y="33" fill="#f29e85" class="font-pixel" font-size="8.5">LEVEL 80 // PERSIST</text>
      <rect x="8" y="44" width="184" height="4" fill="#0f141d"/>
      <rect x="8" y="44" width="147" height="4" fill="#f29e85"/>
      <text x="8" y="56" fill="#75869c" class="font-pixel" font-size="7.5">Relational schemas, Redis cache</text>
    </g>

    <!-- Slot 8: DevOps & Environments -->
    <g transform="translate(642, 72)">
      <rect class="slot" x="0" y="0" width="200" height="62"/>
      <rect x="8" y="8" width="28" height="28" fill="#1d2638" stroke="#364964" stroke-width="1"/>
      <text x="12" y="26" fill="#4ba3a3" class="font-pixel" font-size="13" font-weight="bold">DK</text>
      <text x="44" y="21" fill="#eae5d9" class="font-pixel" font-size="11" font-weight="bold">Docker &amp; Linux</text>
      <text x="44" y="33" fill="#4ba3a3" class="font-pixel" font-size="8.5">LEVEL 82 // INFRA</text>
      <rect x="8" y="44" width="184" height="4" fill="#0f141d"/>
      <rect x="8" y="44" width="151" height="4" fill="#4ba3a3"/>
      <text x="8" y="56" fill="#75869c" class="font-pixel" font-size="7.5">Containers, Git CI/CD, Bash</text>
    </g>
  </g>
</svg>
