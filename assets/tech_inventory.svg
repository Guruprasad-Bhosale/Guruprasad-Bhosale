<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <style>
      .font-pixel {
        font-family: 'Courier New', Courier, monospace;
        shape-rendering: crispEdges;
      }
      .slot {
        fill: #1C2635;
        stroke: #35465B;
        stroke-width: 1.5;
      }
    </style>
  </defs>

  <!-- Outer Window -->
  <rect x="0" y="0" width="880" height="180" fill="#151B26" stroke="#35465B" stroke-width="2" rx="2" shape-rendering="crispEdges"/>

  <!-- Title bar -->
  <rect x="1" y="1" width="878" height="26" fill="#1C2635" shape-rendering="crispEdges"/>
  <line x1="1" y1="27" x2="879" y2="27" stroke="#35465B" stroke-width="1.5"/>
  <rect x="12" y="8" width="10" height="10" fill="#4BA3A3" shape-rendering="crispEdges"/>
  <text x="28" y="18" fill="#EAE5D9" class="font-pixel" font-size="10.5" font-weight="bold">INVENTORY.SYS // EQUIPPED TECH &amp; RUNTIMES</text>
  <text x="835" y="18" fill="#94A3B8" class="font-pixel" font-size="9">_ □ ×</text>

  <!-- Grid of 8 Equip Slots (2 rows of 4) -->
  <g transform="translate(18, 38)">
    <!-- ROW 1 -->
    <!-- Slot 1: Python -->
    <g transform="translate(0, 0)">
      <rect class="slot" x="0" y="0" width="202" height="60" rx="1"/>
      <rect x="8" y="8" width="26" height="26" fill="#202C3D" stroke="#35465B" stroke-width="1"/>
      <text x="13" y="25" fill="#4BA3A3" class="font-pixel" font-size="13" font-weight="bold">Py</text>
      <text x="42" y="20" fill="#EAE5D9" class="font-pixel" font-size="10.5" font-weight="bold">Python</text>
      <text x="42" y="32" fill="#F29E85" class="font-pixel" font-size="8">CORE // AI &amp; SCRIPTING</text>
      <rect x="8" y="42" width="186" height="4" fill="#151B26"/>
      <rect x="8" y="42" width="168" height="4" fill="#4BA3A3"/>
      <text x="8" y="54" fill="#94A3B8" class="font-pixel" font-size="7">Primary runtime for AI/ML pipelines</text>
    </g>

    <!-- Slot 2: TypeScript / JS -->
    <g transform="translate(214, 0)">
      <rect class="slot" x="0" y="0" width="202" height="60" rx="1"/>
      <rect x="8" y="8" width="26" height="26" fill="#202C3D" stroke="#35465B" stroke-width="1"/>
      <text x="13" y="25" fill="#9D8EC2" class="font-pixel" font-size="13" font-weight="bold">TS</text>
      <text x="42" y="20" fill="#EAE5D9" class="font-pixel" font-size="10.5" font-weight="bold">TypeScript / JS</text>
      <text x="42" y="32" fill="#9D8EC2" class="font-pixel" font-size="8">CORE // FULL STACK</text>
      <rect x="8" y="42" width="186" height="4" fill="#151B26"/>
      <rect x="8" y="42" width="158" height="4" fill="#9D8EC2"/>
      <text x="8" y="54" fill="#94A3B8" class="font-pixel" font-size="7">Type-safe frontend &amp; Node runtimes</text>
    </g>

    <!-- Slot 3: Computer Vision -->
    <g transform="translate(428, 0)">
      <rect class="slot" x="0" y="0" width="202" height="60" rx="1"/>
      <rect x="8" y="8" width="26" height="26" fill="#202C3D" stroke="#35465B" stroke-width="1"/>
      <text x="11" y="25" fill="#F29E85" class="font-pixel" font-size="13" font-weight="bold">CV</text>
      <text x="42" y="20" fill="#EAE5D9" class="font-pixel" font-size="10.5" font-weight="bold">OpenCV / MediaPipe</text>
      <text x="42" y="32" fill="#F29E85" class="font-pixel" font-size="8">VISION // SPATIAL UX</text>
      <rect x="8" y="42" width="186" height="4" fill="#151B26"/>
      <rect x="8" y="42" width="162" height="4" fill="#F29E85"/>
      <text x="8" y="54" fill="#94A3B8" class="font-pixel" font-size="7">Hand tracking, landmarks, spatial UI</text>
    </g>

    <!-- Slot 4: AI & Deep Learning -->
    <g transform="translate(642, 0)">
      <rect class="slot" x="0" y="0" width="202" height="60" rx="1"/>
      <rect x="8" y="8" width="26" height="26" fill="#202C3D" stroke="#35465B" stroke-width="1"/>
      <text x="12" y="25" fill="#4BA3A3" class="font-pixel" font-size="13" font-weight="bold">AI</text>
      <text x="42" y="20" fill="#EAE5D9" class="font-pixel" font-size="10.5" font-weight="bold">PyTorch / TensorFlow</text>
      <text x="42" y="32" fill="#4BA3A3" class="font-pixel" font-size="8">MODELS // EMBEDDINGS</text>
      <rect x="8" y="42" width="186" height="4" fill="#151B26"/>
      <rect x="8" y="42" width="150" height="4" fill="#4BA3A3"/>
      <text x="8" y="54" fill="#94A3B8" class="font-pixel" font-size="7">Neural architectures &amp; inference</text>
    </g>

    <!-- ROW 2 -->
    <!-- Slot 5: React & Next.js -->
    <g transform="translate(0, 68)">
      <rect class="slot" x="0" y="0" width="202" height="60" rx="1"/>
      <rect x="8" y="8" width="26" height="26" fill="#202C3D" stroke="#35465B" stroke-width="1"/>
      <text x="12" y="25" fill="#4BA3A3" class="font-pixel" font-size="13" font-weight="bold">NX</text>
      <text x="42" y="20" fill="#EAE5D9" class="font-pixel" font-size="10.5" font-weight="bold">React &amp; Next.js</text>
      <text x="42" y="32" fill="#4BA3A3" class="font-pixel" font-size="8">UI // INTERACTIVE WEB</text>
      <rect x="8" y="42" width="186" height="4" fill="#151B26"/>
      <rect x="8" y="42" width="155" height="4" fill="#4BA3A3"/>
      <text x="8" y="54" fill="#94A3B8" class="font-pixel" font-size="7">SSR, reactive systems &amp; client state</text>
    </g>

    <!-- Slot 6: Backend & APIs -->
    <g transform="translate(214, 68)">
      <rect class="slot" x="0" y="0" width="202" height="60" rx="1"/>
      <rect x="8" y="8" width="26" height="26" fill="#202C3D" stroke="#35465B" stroke-width="1"/>
      <text x="12" y="25" fill="#9D8EC2" class="font-pixel" font-size="13" font-weight="bold">AP</text>
      <text x="42" y="20" fill="#EAE5D9" class="font-pixel" font-size="10.5" font-weight="bold">FastAPI &amp; Node.js</text>
      <text x="42" y="32" fill="#9D8EC2" class="font-pixel" font-size="8">API // ASYNC SERVICES</text>
      <rect x="8" y="42" width="186" height="4" fill="#151B26"/>
      <rect x="8" y="42" width="152" height="4" fill="#9D8EC2"/>
      <text x="8" y="54" fill="#94A3B8" class="font-pixel" font-size="7">Microservices, REST &amp; WebSockets</text>
    </g>

    <!-- Slot 7: Databases & Cache -->
    <g transform="translate(428, 68)">
      <rect class="slot" x="0" y="0" width="202" height="60" rx="1"/>
      <rect x="8" y="8" width="26" height="26" fill="#202C3D" stroke="#35465B" stroke-width="1"/>
      <text x="12" y="25" fill="#F29E85" class="font-pixel" font-size="13" font-weight="bold">DB</text>
      <text x="42" y="20" fill="#EAE5D9" class="font-pixel" font-size="10.5" font-weight="bold">PostgreSQL &amp; Mongo</text>
      <text x="42" y="32" fill="#F29E85" class="font-pixel" font-size="8">DATA // PERSISTENCE</text>
      <rect x="8" y="42" width="186" height="4" fill="#151B26"/>
      <rect x="8" y="42" width="148" height="4" fill="#F29E85"/>
      <text x="8" y="54" fill="#94A3B8" class="font-pixel" font-size="7">Relational schemas, Redis caching</text>
    </g>

    <!-- Slot 8: DevOps & Environments -->
    <g transform="translate(642, 68)">
      <rect class="slot" x="0" y="0" width="202" height="60" rx="1"/>
      <rect x="8" y="8" width="26" height="26" fill="#202C3D" stroke="#35465B" stroke-width="1"/>
      <text x="12" y="25" fill="#4BA3A3" class="font-pixel" font-size="13" font-weight="bold">DK</text>
      <text x="42" y="20" fill="#EAE5D9" class="font-pixel" font-size="10.5" font-weight="bold">Docker &amp; Linux</text>
      <text x="42" y="32" fill="#4BA3A3" class="font-pixel" font-size="8">INFRA // ENVIRONMENTS</text>
      <rect x="8" y="42" width="186" height="4" fill="#151B26"/>
      <rect x="8" y="42" width="154" height="4" fill="#4BA3A3"/>
      <text x="8" y="54" fill="#94A3B8" class="font-pixel" font-size="7">Containers, Git Actions CI/CD, Bash</text>
    </g>
  </g>
</svg>
