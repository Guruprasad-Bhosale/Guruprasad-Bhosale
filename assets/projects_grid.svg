<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="100%" height="100%">
  <defs>
    <style>
      .font-pixel {
        font-family: 'Courier New', Courier, monospace;
        shape-rendering: crispEdges;
      }
      .card {
        fill: #151b26;
        stroke: #2c3a4f;
        stroke-width: 1.5;
        transition: all 0.2s ease;
      }
      .tag-box {
        fill: #1b2332;
        stroke: #33445d;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- ROW 1 (3 Cards) -->

  <!-- CARD 1: KindDoor -->
  <g transform="translate(0, 0)">
    <rect class="card" x="0" y="0" width="280" height="175" rx="2" shape-rendering="crispEdges"/>
    <!-- Mini Pixel Banner -->
    <rect x="6" y="6" width="268" height="58" fill="#1b2332" shape-rendering="crispEdges"/>
    <!-- Pixel Door & Smart Chime -->
    <rect x="25" y="14" width="26" height="42" fill="#2d3c54" stroke="#4a5f82" stroke-width="1"/>
    <circle cx="45" cy="35" r="2" fill="#f29e85"/>
    <rect x="60" y="24" width="12" height="12" fill="#4ba3a3" rx="1"/>
    <!-- Sound waves -->
    <path d="M78 26 Q84 30 78 34" fill="none" stroke="#eae5d9" stroke-width="1.5"/>
    <path d="M83 23 Q91 30 83 37" fill="none" stroke="#4ba3a3" stroke-width="1.5"/>
    <text x="110" y="32" fill="#9d8ec2" class="font-pixel" font-size="8.5">AMAZON HACKATHON</text>
    <text x="110" y="46" fill="#eae5d9" class="font-pixel" font-size="9" font-weight="bold">AI ACCESS PORTAL</text>

    <!-- Card Content -->
    <text x="12" y="82" fill="#eae5d9" class="font-pixel" font-size="12" font-weight="bold">KindDoor ↗</text>
    <text x="12" y="100" fill="#9daab8" class="font-pixel" font-size="9.5">AI front-door agent assisting</text>
    <text x="12" y="114" fill="#9daab8" class="font-pixel" font-size="9.5">elderly, blind, and deaf users.</text>

    <!-- Tech tags -->
    <g transform="translate(12, 134)">
      <rect class="tag-box" x="0" y="0" width="46" height="18"/>
      <text x="10" y="12" fill="#f29e85" class="font-pixel" font-size="8.5">AWS</text>

      <rect class="tag-box" x="52" y="0" width="46" height="18"/>
      <text x="61" y="12" fill="#4ba3a3" class="font-pixel" font-size="8.5">Ring</text>

      <rect class="tag-box" x="104" y="0" width="90" height="18"/>
      <text x="111" y="12" fill="#9d8ec2" class="font-pixel" font-size="8.5">Multimodal AI</text>
    </g>
  </g>

  <!-- CARD 2: PayVia -->
  <g transform="translate(300, 0)">
    <rect class="card" x="0" y="0" width="280" height="175" rx="2" shape-rendering="crispEdges"/>
    <!-- Mini Pixel Banner -->
    <rect x="6" y="6" width="268" height="58" fill="#1b2332" shape-rendering="crispEdges"/>
    <!-- Pixel Negotiation Robots / Coins -->
    <rect x="25" y="20" width="16" height="18" fill="#4ba3a3" rx="1"/>
    <circle cx="29" cy="26" r="1.5" fill="#151b26"/>
    <circle cx="37" cy="26" r="1.5" fill="#151b26"/>
    <text x="50" y="32" fill="#f29e85" class="font-pixel" font-size="12" font-weight="bold">⇄</text>
    <rect x="68" y="20" width="16" height="18" fill="#9d8ec2" rx="1"/>
    <circle cx="72" cy="26" r="1.5" fill="#151b26"/>
    <circle cx="80" cy="26" r="1.5" fill="#151b26"/>
    <text x="96" y="32" fill="#4ba3a3" class="font-pixel" font-size="8.5">AGENT SETTLEMENT</text>
    <text x="96" y="46" fill="#eae5d9" class="font-pixel" font-size="9" font-weight="bold">MULTI-AGENT PROTOCOL</text>

    <!-- Card Content -->
    <text x="12" y="82" fill="#eae5d9" class="font-pixel" font-size="12" font-weight="bold">PayVia ↗</text>
    <text x="12" y="100" fill="#9daab8" class="font-pixel" font-size="9.5">Autonomous AI agents negotiating</text>
    <text x="12" y="114" fill="#9daab8" class="font-pixel" font-size="9.5">terms prior to PayPal settlement.</text>

    <!-- Tech tags -->
    <g transform="translate(12, 134)">
      <rect class="tag-box" x="0" y="0" width="60" height="18"/>
      <text x="8" y="12" fill="#4ba3a3" class="font-pixel" font-size="8.5">Next.js</text>

      <rect class="tag-box" x="66" y="0" width="56" height="18"/>
      <text x="74" y="12" fill="#9d8ec2" class="font-pixel" font-size="8.5">PayPal</text>

      <rect class="tag-box" x="128" y="0" width="68" height="18"/>
      <text x="135" y="12" fill="#f29e85" class="font-pixel" font-size="8.5">AI Agents</text>
    </g>
  </g>

  <!-- CARD 3: FixMyUI -->
  <g transform="translate(600, 0)">
    <rect class="card" x="0" y="0" width="280" height="175" rx="2" shape-rendering="crispEdges"/>
    <!-- Mini Pixel Banner -->
    <rect x="6" y="6" width="268" height="58" fill="#1b2332" shape-rendering="crispEdges"/>
    <!-- Pixel Bug & Repair Wrench -->
    <rect x="25" y="24" width="16" height="12" fill="#e57373" rx="2"/>
    <circle cx="28" cy="27" r="1.5" fill="#151b26"/>
    <circle cx="38" cy="27" r="1.5" fill="#151b26"/>
    <line x1="22" y1="26" x2="25" y2="28" stroke="#e57373" stroke-width="1.5"/>
    <line x1="22" y1="32" x2="25" y2="30" stroke="#e57373" stroke-width="1.5"/>
    <text x="50" y="32" fill="#4ba3a3" class="font-pixel" font-size="12" font-weight="bold">→</text>
    <rect x="68" y="20" width="20" height="20" fill="#243044" stroke="#4ba3a3" stroke-width="1"/>
    <text x="72" y="34" fill="#4ba3a3" class="font-pixel" font-size="11">✓</text>
    <text x="98" y="32" fill="#9d8ec2" class="font-pixel" font-size="8.5">UI AUTODEBUGGER</text>
    <text x="98" y="46" fill="#eae5d9" class="font-pixel" font-size="9" font-weight="bold">HEALING ENGINE</text>

    <!-- Card Content -->
    <text x="12" y="82" fill="#eae5d9" class="font-pixel" font-size="12" font-weight="bold">FixMyUI ↗</text>
    <text x="12" y="100" fill="#9daab8" class="font-pixel" font-size="9.5">AI-powered visual debugging &amp;</text>
    <text x="12" y="114" fill="#9daab8" class="font-pixel" font-size="9.5">DOM auto-repair platform.</text>

    <!-- Tech tags -->
    <g transform="translate(12, 134)">
      <rect class="tag-box" x="0" y="0" width="60" height="18"/>
      <text x="8" y="12" fill="#4ba3a3" class="font-pixel" font-size="8.5">Next.js</text>

      <rect class="tag-box" x="66" y="0" width="76" height="18"/>
      <text x="73" y="12" fill="#f29e85" class="font-pixel" font-size="8.5">Playwright</text>

      <rect class="tag-box" x="148" y="0" width="50" height="18"/>
      <text x="156" y="12" fill="#9d8ec2" class="font-pixel" font-size="8.5">AST</text>
    </g>
  </g>

  <!-- ROW 2 (3 Cards) -->

  <!-- CARD 4: RETRACE -->
  <g transform="translate(0, 190)">
    <rect class="card" x="0" y="0" width="280" height="175" rx="2" shape-rendering="crispEdges"/>
    <!-- Mini Pixel Banner -->
    <rect x="6" y="6" width="268" height="58" fill="#1b2332" shape-rendering="crispEdges"/>
    <!-- Pixel Timeline & Commit rollback -->
    <line x1="20" y1="35" x2="80" y2="35" stroke="#4ba3a3" stroke-width="2"/>
    <circle cx="28" cy="35" r="4" fill="#9d8ec2"/>
    <circle cx="50" cy="35" r="4" fill="#f29e85"/>
    <circle cx="72" cy="35" r="4" fill="#4ba3a3"/>
    <path d="M 68 25 Q 50 16 32 25" fill="none" stroke="#f29e85" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="96" y="32" fill="#4ba3a3" class="font-pixel" font-size="8.5">CONTEXT RECOVERY</text>
    <text x="96" y="46" fill="#eae5d9" class="font-pixel" font-size="9" font-weight="bold">AUTONOMOUS REGRESSION</text>

    <!-- Card Content -->
    <text x="12" y="82" fill="#eae5d9" class="font-pixel" font-size="12" font-weight="bold">RETRACE ↗</text>
    <text x="12" y="100" fill="#9daab8" class="font-pixel" font-size="9.5">Autonomous regression finder &amp;</text>
    <text x="12" y="114" fill="#9daab8" class="font-pixel" font-size="9.5">test context recovery engine.</text>

    <!-- Tech tags -->
    <g transform="translate(12, 134)">
      <rect class="tag-box" x="0" y="0" width="76" height="18"/>
      <text x="7" y="12" fill="#4ba3a3" class="font-pixel" font-size="8.5">Playwright</text>

      <rect class="tag-box" x="82" y="0" width="56" height="18"/>
      <text x="90" y="12" fill="#f29e85" class="font-pixel" font-size="8.5">AST Map</text>

      <rect class="tag-box" x="144" y="0" width="56" height="18"/>
      <text x="151" y="12" fill="#9d8ec2" class="font-pixel" font-size="8.5">Python</text>
    </g>
  </g>

  <!-- CARD 5: SIGNOVA -->
  <g transform="translate(300, 190)">
    <rect class="card" x="0" y="0" width="280" height="175" rx="2" shape-rendering="crispEdges"/>
    <!-- Mini Pixel Banner -->
    <rect x="6" y="6" width="268" height="58" fill="#1b2332" shape-rendering="crispEdges"/>
    <!-- Pixel Hand Gesture Signing -->
    <g transform="translate(25, 14)">
      <!-- Hand outline -->
      <path d="M 6 36 L 6 18 L 10 18 L 10 36 M 12 36 L 12 12 L 16 12 L 16 36 M 18 36 L 18 14 L 22 14 L 22 36 M 24 36 L 24 20 L 28 20 L 28 36" stroke="#f29e85" stroke-width="2"/>
      <path d="M 4 36 L 30 36 L 28 42 L 6 42 Z" fill="#f29e85"/>
      <circle cx="8" cy="12" r="1.5" fill="#4ba3a3"/>
      <circle cx="14" cy="7" r="1.5" fill="#4ba3a3"/>
      <circle cx="20" cy="9" r="1.5" fill="#4ba3a3"/>
    </g>
    <text x="68" y="32" fill="#9d8ec2" class="font-pixel" font-size="8.5">ISL TRANSLATION</text>
    <text x="68" y="46" fill="#eae5d9" class="font-pixel" font-size="9" font-weight="bold">SIGN-TO-SPEECH MODEL</text>

    <!-- Card Content -->
    <text x="12" y="82" fill="#eae5d9" class="font-pixel" font-size="12" font-weight="bold">SIGNOVA ↗</text>
    <text x="12" y="100" fill="#9daab8" class="font-pixel" font-size="9.5">Indian Sign Language to English</text>
    <text x="12" y="114" fill="#9daab8" class="font-pixel" font-size="9.5">real-time translation system.</text>

    <!-- Tech tags -->
    <g transform="translate(12, 134)">
      <rect class="tag-box" x="0" y="0" width="74" height="18"/>
      <text x="7" y="12" fill="#4ba3a3" class="font-pixel" font-size="8.5">MediaPipe</text>

      <rect class="tag-box" x="80" y="0" width="60" height="18"/>
      <text x="88" y="12" fill="#9d8ec2" class="font-pixel" font-size="8.5">PyTorch</text>

      <rect class="tag-box" x="146" y="0" width="56" height="18"/>
      <text x="154" y="12" fill="#f29e85" class="font-pixel" font-size="8.5">OpenCV</text>
    </g>
  </g>

  <!-- CARD 6: VISIONCTRL -->
  <g transform="translate(600, 190)">
    <rect class="card" x="0" y="0" width="280" height="175" rx="2" shape-rendering="crispEdges"/>
    <!-- Mini Pixel Banner -->
    <rect x="6" y="6" width="268" height="58" fill="#1b2332" shape-rendering="crispEdges"/>
    <!-- Spatial Control Camera & Beam -->
    <circle cx="35" cy="35" r="14" fill="#1c2536" stroke="#4ba3a3" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="6" fill="#4ba3a3"/>
    <circle cx="35" cy="35" r="2" fill="#151b26"/>
    <!-- Targeting reticle -->
    <line x1="35" y1="16" x2="35" y2="20" stroke="#eae5d9" stroke-width="1"/>
    <line x1="35" y1="50" x2="35" y2="54" stroke="#eae5d9" stroke-width="1"/>
    <line x1="16" y1="35" x2="20" y2="35" stroke="#eae5d9" stroke-width="1"/>
    <line x1="50" y1="35" x2="54" y2="35" stroke="#eae5d9" stroke-width="1"/>
    <text x="62" y="32" fill="#f29e85" class="font-pixel" font-size="8.5">TOUCHLESS DESKTOP</text>
    <text x="62" y="46" fill="#eae5d9" class="font-pixel" font-size="9" font-weight="bold">SPATIAL GESTURE UX</text>

    <!-- Card Content -->
    <text x="12" y="82" fill="#eae5d9" class="font-pixel" font-size="12" font-weight="bold">VISIONCTRL ↗</text>
    <text x="12" y="100" fill="#9daab8" class="font-pixel" font-size="9.5">Camera-based spatial interaction</text>
    <text x="12" y="114" fill="#9daab8" class="font-pixel" font-size="9.5">&amp; hand-controlled desktop OS.</text>

    <!-- Tech tags -->
    <g transform="translate(12, 134)">
      <rect class="tag-box" x="0" y="0" width="60" height="18"/>
      <text x="8" y="12" fill="#4ba3a3" class="font-pixel" font-size="8.5">OpenCV</text>

      <rect class="tag-box" x="66" y="0" width="56" height="18"/>
      <text x="74" y="12" fill="#9d8ec2" class="font-pixel" font-size="8.5">Python</text>

      <rect class="tag-box" x="128" y="0" width="70" height="18"/>
      <text x="135" y="12" fill="#f29e85" class="font-pixel" font-size="8.5">Spatial UI</text>
    </g>
  </g>
</svg>
