<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 170" width="100%" height="100%">
  <defs>
    <style>
      .font-pixel {
        font-family: 'Courier New', Courier, monospace;
        shape-rendering: crispEdges;
      }
      .tag-box {
        fill: #202C3D;
        stroke: #35465B;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="0" y="0" width="280" height="170" fill="#151B26" stroke="#35465B" stroke-width="1.5" rx="2" shape-rendering="crispEdges"/>
  
  <!-- Title bar -->
  <rect x="1" y="1" width="278" height="24" fill="#1C2635" shape-rendering="crispEdges"/>
  <line x1="1" y1="25" x2="279" y2="25" stroke="#35465B" stroke-width="1"/>
  <rect x="8" y="7" width="9" height="9" fill="#4BA3A3" shape-rendering="crispEdges"/>
  <text x="22" y="17" fill="#EAE5D9" class="font-pixel" font-size="9.5" font-weight="bold">KINDDOOR.EXE</text>
  <text x="238" y="17" fill="#94A3B8" class="font-pixel" font-size="8.5">_ □ ×</text>

  <!-- Pixel Art Scene Banner (Illuminated front door + smart camera + sound waves) -->
  <g transform="translate(6, 28)">
    <rect x="0" y="0" width="268" height="54" fill="#1C2635" shape-rendering="crispEdges"/>
    <!-- Porch lamp glowing -->
    <circle cx="22" cy="18" r="5" fill="#F29E85" opacity="0.9"/>
    <circle cx="22" cy="18" r="9" fill="#F29E85" opacity="0.2"/>
    <rect x="20" y="10" width="4" height="4" fill="#35465B"/>
    <!-- Door Frame -->
    <rect x="36" y="10" width="26" height="44" fill="#202C3D" stroke="#35465B" stroke-width="1.5"/>
    <rect x="40" y="14" width="18" height="16" fill="#151B26" stroke="#2C3D52" stroke-width="1"/>
    <rect x="40" y="34" width="18" height="16" fill="#151B26" stroke="#2C3D52" stroke-width="1"/>
    <!-- Brass handle -->
    <circle cx="58" cy="32" r="1.5" fill="#F29E85"/>
    <!-- Smart Camera Beacon -->
    <rect x="68" y="20" width="8" height="10" fill="#202C3D" stroke="#4BA3A3" stroke-width="1"/>
    <circle cx="72" cy="25" r="1.5" fill="#4BA3A3"/>
    <!-- Accessibility Audio/Visual Waves -->
    <path d="M 82 20 Q 88 25 82 30" fill="none" stroke="#EAE5D9" stroke-width="1.5"/>
    <path d="M 87 17 Q 95 25 87 33" fill="none" stroke="#4BA3A3" stroke-width="1.5"/>
    <path d="M 92 14 Q 102 25 92 36" fill="none" stroke="#9D8EC2" stroke-width="1.5"/>

    <!-- Scene Tag -->
    <text x="116" y="24" fill="#9D8EC2" class="font-pixel" font-size="8">AMAZON HACKATHON</text>
    <text x="116" y="38" fill="#EAE5D9" class="font-pixel" font-size="9" font-weight="bold">AI ACCESS AGENT</text>
  </g>

  <!-- Project Info -->
  <text x="12" y="98" fill="#EAE5D9" class="font-pixel" font-size="12" font-weight="bold">KindDoor ↗</text>
  <text x="12" y="112" fill="#94A3B8" class="font-pixel" font-size="8.5">Accessibility AI front-door assistant</text>
  <text x="12" y="124" fill="#94A3B8" class="font-pixel" font-size="8.5">for elderly, blind, and deaf visitors.</text>

  <!-- Tech tags -->
  <g transform="translate(12, 138)">
    <rect class="tag-box" x="0" y="0" width="46" height="18"/>
    <text x="11" y="12" fill="#F29E85" class="font-pixel" font-size="8.5">AWS</text>

    <rect class="tag-box" x="52" y="0" width="56" height="18"/>
    <text x="60" y="12" fill="#4BA3A3" class="font-pixel" font-size="8.5">Ring API</text>

    <rect class="tag-box" x="114" y="0" width="94" height="18"/>
    <text x="121" y="12" fill="#9D8EC2" class="font-pixel" font-size="8.5">Multimodal AI</text>
  </g>
</svg>
