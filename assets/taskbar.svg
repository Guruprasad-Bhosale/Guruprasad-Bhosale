<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 32" width="100%" height="100%">
  <defs>
    <style>
      .font-pixel {
        font-family: 'Courier New', Courier, monospace;
        shape-rendering: crispEdges;
      }
    </style>
  </defs>

  <!-- Taskbar container -->
  <rect x="0" y="0" width="880" height="32" fill="#151B26" stroke="#35465B" stroke-width="1.5" shape-rendering="crispEdges"/>

  <!-- Start Button -->
  <g transform="translate(6, 4)">
    <rect x="0" y="0" width="72" height="24" fill="#202C3D" stroke="#35465B" stroke-width="1" shape-rendering="crispEdges"/>
    <!-- Pixel 4-square flag -->
    <rect x="8" y="7" width="4" height="4" fill="#F29E85"/>
    <rect x="14" y="7" width="4" height="4" fill="#4BA3A3"/>
    <rect x="8" y="13" width="4" height="4" fill="#9D8EC2"/>
    <rect x="14" y="13" width="4" height="4" fill="#EAE5D9"/>
    <text x="24" y="16" fill="#EAE5D9" class="font-pixel" font-size="10" font-weight="bold">START</text>
  </g>

  <!-- Open Windows / Tabs -->
  <g transform="translate(86, 4)">
    <!-- Tab 1: Active -->
    <rect x="0" y="0" width="112" height="24" fill="#1C2635" stroke="#4BA3A3" stroke-width="1" shape-rendering="crispEdges"/>
    <text x="10" y="16" fill="#4BA3A3" class="font-pixel" font-size="9" font-weight="bold">● GP-OS v2.4</text>

    <!-- Tab 2 -->
    <rect x="118" y="0" width="110" height="24" fill="#151B26" stroke="#35465B" stroke-width="1" shape-rendering="crispEdges"/>
    <text x="128" y="16" fill="#94A3B8" class="font-pixel" font-size="9">▣ PROJECTS.LOG</text>

    <!-- Tab 3 -->
    <rect x="234" y="0" width="110" height="24" fill="#151B26" stroke="#35465B" stroke-width="1" shape-rendering="crispEdges"/>
    <text x="244" y="16" fill="#94A3B8" class="font-pixel" font-size="9">⚙ TERMINAL.SH</text>
  </g>

  <!-- System Tray (Right) -->
  <g transform="translate(560, 4)">
    <rect x="0" y="0" width="314" height="24" fill="#1C2635" stroke="#35465B" stroke-width="1" shape-rendering="crispEdges"/>
    
    <text x="12" y="16" fill="#4BA3A3" class="font-pixel" font-size="9">PROFILE REPO</text>
    <text x="96" y="16" fill="#35465B" class="font-pixel" font-size="9">|</text>
    <text x="106" y="16" fill="#EAE5D9" class="font-pixel" font-size="9">BRANCH: MAIN</text>
    <text x="198" y="16" fill="#35465B" class="font-pixel" font-size="9">|</text>
    <text x="208" y="16" fill="#F29E85" class="font-pixel" font-size="9">KOLHAPUR, IN</text>
  </g>
</svg>
