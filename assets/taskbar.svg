<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 36" width="100%" height="100%">
  <defs>
    <style>
      .font-pixel {
        font-family: 'Courier New', Courier, monospace;
        shape-rendering: crispEdges;
      }
    </style>
  </defs>

  <!-- Taskbar container -->
  <rect x="0" y="0" width="880" height="36" fill="#151b26" stroke="#2c3a4f" stroke-width="2" shape-rendering="crispEdges"/>

  <!-- Start Button -->
  <g transform="translate(6, 5)">
    <rect x="0" y="0" width="76" height="26" fill="#243044" stroke="#485c7b" stroke-width="1.5" shape-rendering="crispEdges"/>
    <!-- Pixel 4-square flag -->
    <rect x="8" y="7" width="5" height="5" fill="#f29e85"/>
    <rect x="15" y="7" width="5" height="5" fill="#4ba3a3"/>
    <rect x="8" y="14" width="5" height="5" fill="#9d8ec2"/>
    <rect x="15" y="14" width="5" height="5" fill="#eae5d9"/>
    <text x="26" y="18" fill="#eae5d9" class="font-pixel" font-size="10.5" font-weight="bold">START</text>
  </g>

  <!-- Open Windows / Tabs -->
  <g transform="translate(90, 5)">
    <!-- Tab 1: Active -->
    <rect x="0" y="0" width="110" height="26" fill="#1c2536" stroke="#4ba3a3" stroke-width="1.5" shape-rendering="crispEdges"/>
    <text x="10" y="17" fill="#4ba3a3" class="font-pixel" font-size="9.5" font-weight="bold">● GP-OS v2.4</text>

    <!-- Tab 2 -->
    <rect x="116" y="0" width="105" height="26" fill="#18202d" stroke="#2c3a4f" stroke-width="1" shape-rendering="crispEdges"/>
    <text x="126" y="17" fill="#8795a8" class="font-pixel" font-size="9">▣ KindDoor</text>

    <!-- Tab 3 -->
    <rect x="227" y="0" width="105" height="26" fill="#18202d" stroke="#2c3a4f" stroke-width="1" shape-rendering="crispEdges"/>
    <text x="237" y="17" fill="#8795a8" class="font-pixel" font-size="9">▣ RETRACE</text>

    <!-- Tab 4 -->
    <rect x="338" y="0" width="105" height="26" fill="#18202d" stroke="#2c3a4f" stroke-width="1" shape-rendering="crispEdges"/>
    <text x="348" y="17" fill="#8795a8" class="font-pixel" font-size="9">▣ VISIONCTRL</text>
  </g>

  <!-- System Tray (Right) -->
  <g transform="translate(565, 5)">
    <rect x="0" y="0" width="308" height="26" fill="#101520" stroke="#232d3d" stroke-width="1" shape-rendering="crispEdges"/>
    
    <text x="10" y="17" fill="#f29e85" class="font-pixel" font-size="9">☼ 24°C</text>
    <text x="65" y="17" fill="#8795a8" class="font-pixel" font-size="9">|</text>
    <text x="75" y="17" fill="#4ba3a3" class="font-pixel" font-size="9">KOLHAPUR, IN</text>
    <text x="160" y="17" fill="#8795a8" class="font-pixel" font-size="9">|</text>
    <text x="170" y="17" fill="#9d8ec2" class="font-pixel" font-size="9">BAT: 100%</text>
    <text x="230" y="17" fill="#8795a8" class="font-pixel" font-size="9">|</text>
    <text x="240" y="17" fill="#eae5d9" class="font-pixel" font-size="9" font-weight="bold">17:11 IST</text>
  </g>
</svg>
