<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="100%">
  <defs>
    <style>
      .font-pixel {
        font-family: 'Courier New', Courier, monospace;
        shape-rendering: crispEdges;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; }
      .text-teal { fill: #4BA3A3; }
      .text-peach { fill: #F29E85; }
      .text-cream { fill: #EAE5D9; }
      .text-lavender { fill: #9D8EC2; }
      .text-muted { fill: #94A3B8; }
    </style>
  </defs>

  <!-- WINDOW 1: ABOUT.MD (Left, Width 432) -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="432" height="250" fill="#151B26" stroke="#35465B" stroke-width="2" rx="2" shape-rendering="crispEdges"/>
    
    <!-- Title bar -->
    <rect x="1" y="1" width="430" height="26" fill="#1C2635" shape-rendering="crispEdges"/>
    <line x1="1" y1="27" x2="431" y2="27" stroke="#35465B" stroke-width="1.5"/>
    <rect x="12" y="8" width="10" height="10" fill="#9D8EC2" shape-rendering="crispEdges"/>
    <text x="28" y="18" fill="#EAE5D9" class="font-pixel" font-size="10.5" font-weight="bold">ABOUT.MD // PERSONAL PROFILE</text>
    <text x="395" y="18" fill="#94A3B8" class="font-pixel" font-size="9">_ □ ×</text>

    <!-- Body content -->
    <g transform="translate(18, 42)">
      <text x="0" y="14" class="font-pixel text-peach" font-size="13" font-weight="bold">Hey, I'm Guruprasad.</text>
      
      <text x="0" y="38" class="font-pixel text-muted" font-size="10">A final-year B.Tech student in AI &amp; ML. I design and</text>
      <text x="0" y="52" class="font-pixel text-muted" font-size="10">build across practical AI systems, computer vision</text>
      <text x="0" y="66" class="font-pixel text-muted" font-size="10">pipelines, developer tools, and full-stack software.</text>

      <text x="0" y="96" class="font-pixel text-cream" font-size="10">I care about what happens after the demo: edge</text>
      <text x="0" y="110" class="font-pixel text-cream" font-size="10">cases, rigorous testing, resilient architectures, and</text>
      <text x="0" y="124" class="font-pixel text-cream" font-size="10">software that genuinely solves human problems.</text>

      <!-- Interest tags -->
      <g transform="translate(0, 142)">
        <rect x="0" y="0" width="82" height="18" fill="#202C3D" stroke="#35465B" stroke-width="1" shape-rendering="crispEdges"/>
        <text x="8" y="12" fill="#4BA3A3" class="font-pixel" font-size="8.5">AI Agents</text>

        <rect x="90" y="0" width="86" height="18" fill="#202C3D" stroke="#35465B" stroke-width="1" shape-rendering="crispEdges"/>
        <text x="98" y="12" fill="#F29E85" class="font-pixel" font-size="8.5">Spatial UI</text>

        <rect x="184" y="0" width="82" height="18" fill="#202C3D" stroke="#35465B" stroke-width="1" shape-rendering="crispEdges"/>
        <text x="192" y="12" fill="#9D8EC2" class="font-pixel" font-size="8.5">DevTools</text>

        <rect x="274" y="0" width="120" height="18" fill="#202C3D" stroke="#35465B" stroke-width="1" shape-rendering="crispEdges"/>
        <text x="282" y="12" fill="#4BA3A3" class="font-pixel" font-size="8.5">Systems Design</text>
      </g>

      <!-- Bottom Motto Card -->
      <g transform="translate(0, 172)">
        <rect x="0" y="0" width="394" height="26" fill="#1C2635" stroke="#35465B" stroke-width="1" shape-rendering="crispEdges"/>
        <text x="12" y="17" class="font-pixel text-teal" font-size="9.5">// Build → Test → Refine.</text>
        <text x="175" y="17" class="font-pixel text-muted" font-size="8.5">Keep the signal, remove the noise.</text>
      </g>
    </g>
  </g>

  <!-- WINDOW 2: TERMINAL.SH (Right, Width 432) -->
  <g transform="translate(448, 0)">
    <rect x="0" y="0" width="432" height="250" fill="#151B26" stroke="#35465B" stroke-width="2" rx="2" shape-rendering="crispEdges"/>
    
    <!-- Title bar -->
    <rect x="1" y="1" width="430" height="26" fill="#1C2635" shape-rendering="crispEdges"/>
    <line x1="1" y1="27" x2="431" y2="27" stroke="#35465B" stroke-width="1.5"/>
    <rect x="12" y="8" width="10" height="10" fill="#4BA3A3" shape-rendering="crispEdges"/>
    <text x="28" y="18" fill="#EAE5D9" class="font-pixel" font-size="10.5" font-weight="bold">TERMINAL.EXE // SYSTEM CONSOLE</text>
    <text x="395" y="18" fill="#94A3B8" class="font-pixel" font-size="9">_ □ ×</text>

    <!-- Terminal Content -->
    <g transform="translate(18, 42)">
      <!-- Line 1 -->
      <text x="0" y="12" class="font-pixel text-teal" font-size="10">PS &gt; whoami</text>
      <text x="0" y="27" class="font-pixel text-cream" font-size="10">Guruprasad Bhosale (Builder &amp; AIML Engineer)</text>

      <!-- Line 2 -->
      <text x="0" y="50" class="font-pixel text-peach" font-size="10">PS &gt; cat capabilities.log</text>
      <text x="8" y="65" class="font-pixel text-muted" font-size="9.5">&gt; Multimodal agents &amp; pre-settlement protocols</text>
      <text x="8" y="79" class="font-pixel text-muted" font-size="9.5">&gt; Hand / pose spatial tracking &amp; desktop UX</text>
      <text x="8" y="93" class="font-pixel text-muted" font-size="9.5">&gt; Autonomous regression &amp; AST diagnostic engines</text>

      <!-- Line 3 -->
      <text x="0" y="118" class="font-pixel text-lavender" font-size="10">PS &gt; current --focus</text>
      <text x="8" y="133" class="font-pixel text-cream" font-size="9.5">&gt; KindDoor (Amazon Hackathon accessibility agent)</text>
      <text x="8" y="147" class="font-pixel text-muted" font-size="9.5">&gt; Agentic systems design &amp; real-time vision pipelines</text>

      <!-- Line 4 -->
      <text x="0" y="172" class="font-pixel text-teal" font-size="10">PS &gt; echo $LOOP</text>
      <g transform="translate(8, 180)">
        <rect x="0" y="0" width="12" height="10" fill="#4BA3A3"/>
        <rect x="15" y="0" width="12" height="10" fill="#4BA3A3"/>
        <rect x="30" y="0" width="12" height="10" fill="#4BA3A3"/>
        <rect x="45" y="0" width="12" height="10" fill="#202C3D" stroke="#35465B" stroke-width="1"/>
        <text x="65" y="9" class="font-pixel text-cream" font-size="9.5">ITERATING_ACTIVE</text>
      </g>

      <!-- Prompt Line with cursor -->
      <text x="0" y="200" class="font-pixel text-teal" font-size="10">PS &gt;</text>
      <rect x="32" y="191" width="7" height="11" fill="#F29E85" class="cursor"/>
    </g>
  </g>
</svg>
