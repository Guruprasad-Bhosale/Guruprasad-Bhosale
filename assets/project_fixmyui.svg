<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 170" width="100%" height="100%">
  <defs>
    <style>
      .font-pixel {
        font-family: 'Courier New', Courier, monospace;
        shape-rendering: crispEdges;
      }
      .tag-box {
        fill: #202C3D;
        stroke: #35465B;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="0" y="0" width="280" height="170" fill="#151B26" stroke="#35465B" stroke-width="1.5" rx="2" shape-rendering="crispEdges"/>
  
  <!-- Title bar -->
  <rect x="1" y="1" width="278" height="24" fill="#1C2635" shape-rendering="crispEdges"/>
  <line x1="1" y1="25" x2="279" y2="25" stroke="#35465B" stroke-width="1"/>
  <rect x="8" y="7" width="9" height="9" fill="#9D8EC2" shape-rendering="crispEdges"/>
  <text x="22" y="17" fill="#EAE5D9" class="font-pixel" font-size="9.5" font-weight="bold">FIXMYUI.EXE</text>
  <text x="238" y="17" fill="#94A3B8" class="font-pixel" font-size="8.5">_ □ ×</text>

  <!-- Pixel Art Scene Banner (DOM tree node diagnosis & healing wrench) -->
  <g transform="translate(6, 28)">
    <rect x="0" y="0" width="268" height="54" fill="#1C2635" shape-rendering="crispEdges"/>
    <!-- Bug node -->
    <rect x="22" y="22" width="16" height="14" fill="#3D2428" stroke="#F29E85" stroke-width="1.5" rx="2"/>
    <circle cx="26" cy="27" r="1.5" fill="#F29E85"/>
    <circle cx="34" cy="27" r="1.5" fill="#F29E85"/>
    <line x1="18" y1="24" x2="22" y2="26" stroke="#F29E85" stroke-width="1"/>
    <line x1="18" y1="34" x2="22" y2="32" stroke="#F29E85" stroke-width="1"/>
    
    <!-- Repair Arrow -->
    <text x="46" y="33" fill="#4BA3A3" class="font-pixel" font-size="12" font-weight="bold">→</text>

    <!-- Healed UI Component -->
    <rect x="65" y="18" width="24" height="22" fill="#202C3D" stroke="#4BA3A3" stroke-width="1.5" rx="1"/>
    <rect x="68" y="21" width="18" height="5" fill="#35465B"/>
    <circle cx="77" cy="32" r="3" fill="#4BA3A3"/>
    <text x="75" y="34" fill="#151B26" class="font-pixel" font-size="6" font-weight="bold">✓</text>

    <!-- Scene Tag -->
    <text x="105" y="24" fill="#9D8EC2" class="font-pixel" font-size="8">UI DIAGNOSTICS</text>
    <text x="105" y="38" fill="#EAE5D9" class="font-pixel" font-size="9" font-weight="bold">AUTO-REPAIR ENGINE</text>
  </g>

  <!-- Project Info -->
  <text x="12" y="98" fill="#EAE5D9" class="font-pixel" font-size="12" font-weight="bold">FixMyUI ↗</text>
  <text x="12" y="112" fill="#94A3B8" class="font-pixel" font-size="8.5">AI-powered visual debugging &amp; DOM</text>
  <text x="12" y="124" fill="#94A3B8" class="font-pixel" font-size="8.5">auto-repair platform for web interfaces.</text>

  <!-- Tech tags -->
  <g transform="translate(12, 138)">
    <rect class="tag-box" x="0" y="0" width="56" height="18"/>
    <text x="7" y="12" fill="#4BA3A3" class="font-pixel" font-size="8.5">Next.js</text>

    <rect class="tag-box" x="62" y="0" width="74" height="18"/>
    <text x="69" y="12" fill="#F29E85" class="font-pixel" font-size="8.5">Playwright</text>

    <rect class="tag-box" x="142" y="0" width="56" height="18"/>
    <text x="150" y="12" fill="#9D8EC2" class="font-pixel" font-size="8.5">AST Map</text>
  </g>
</svg>
