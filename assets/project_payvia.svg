<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 170" width="100%" height="100%">
  <defs>
    <style>
      .font-pixel {
        font-family: 'Courier New', Courier, monospace;
        shape-rendering: crispEdges;
      }
      .tag-box {
        fill: #202C3D;
        stroke: #35465B;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="0" y="0" width="280" height="170" fill="#151B26" stroke="#35465B" stroke-width="1.5" rx="2" shape-rendering="crispEdges"/>
  
  <!-- Title bar -->
  <rect x="1" y="1" width="278" height="24" fill="#1C2635" shape-rendering="crispEdges"/>
  <line x1="1" y1="25" x2="279" y2="25" stroke="#35465B" stroke-width="1"/>
  <rect x="8" y="7" width="9" height="9" fill="#F29E85" shape-rendering="crispEdges"/>
  <text x="22" y="17" fill="#EAE5D9" class="font-pixel" font-size="9.5" font-weight="bold">PAYVIA.EXE</text>
  <text x="238" y="17" fill="#94A3B8" class="font-pixel" font-size="8.5">_ □ ×</text>

  <!-- Pixel Art Scene Banner (Autonomous negotiation bots + transaction handshake) -->
  <g transform="translate(6, 28)">
    <rect x="0" y="0" width="268" height="54" fill="#1C2635" shape-rendering="crispEdges"/>
    <!-- Buyer Agent (Teal) -->
    <rect x="22" y="18" width="16" height="18" fill="#4BA3A3" rx="1"/>
    <circle cx="26" cy="24" r="1.5" fill="#151B26"/>
    <circle cx="34" cy="24" r="1.5" fill="#151B26"/>
    <line x1="26" y1="30" x2="34" y2="30" stroke="#151B26" stroke-width="1"/>
    <!-- Antenna -->
    <line x1="30" y1="18" x2="30" y2="14" stroke="#4BA3A3" stroke-width="1.5"/>
    <circle cx="30" cy="13" r="1" fill="#EAE5D9"/>

    <!-- Handshake / Agreement Hub -->
    <g transform="translate(48, 20)">
      <circle cx="10" cy="8" r="7" fill="#202C3D" stroke="#35465B" stroke-width="1"/>
      <text x="6" y="12" fill="#F29E85" class="font-pixel" font-size="10" font-weight="bold">⇄</text>
    </g>

    <!-- Merchant Agent (Lavender) -->
    <rect x="76" y="18" width="16" height="18" fill="#9D8EC2" rx="1"/>
    <circle cx="80" cy="24" r="1.5" fill="#151B26"/>
    <circle cx="88" cy="24" r="1.5" fill="#151B26"/>
    <line x1="80" y1="30" x2="88" y2="30" stroke="#151B26" stroke-width="1"/>
    <!-- Antenna -->
    <line x1="84" y1="18" x2="84" y2="14" stroke="#9D8EC2" stroke-width="1.5"/>
    <circle cx="84" cy="13" r="1" fill="#EAE5D9"/>

    <!-- Scene Tag -->
    <text x="110" y="24" fill="#4BA3A3" class="font-pixel" font-size="8">AGENTIC COMMERCE</text>
    <text x="110" y="38" fill="#EAE5D9" class="font-pixel" font-size="9" font-weight="bold">SETTLEMENT PROTOCOL</text>
  </g>

  <!-- Project Info -->
  <text x="12" y="98" fill="#EAE5D9" class="font-pixel" font-size="12" font-weight="bold">PayVia ↗</text>
  <text x="12" y="112" fill="#94A3B8" class="font-pixel" font-size="8.5">AI agents negotiating terms &amp; escrow</text>
  <text x="12" y="124" fill="#94A3B8" class="font-pixel" font-size="8.5">prior to final PayPal settlement.</text>

  <!-- Tech tags -->
  <g transform="translate(12, 138)">
    <rect class="tag-box" x="0" y="0" width="56" height="18"/>
    <text x="7" y="12" fill="#4BA3A3" class="font-pixel" font-size="8.5">Next.js</text>

    <rect class="tag-box" x="62" y="0" width="68" height="18"/>
    <text x="69" y="12" fill="#9D8EC2" class="font-pixel" font-size="8.5">PayPal SDK</text>

    <rect class="tag-box" x="136" y="0" width="68" height="18"/>
    <text x="144" y="12" fill="#F29E85" class="font-pixel" font-size="8.5">AI Agents</text>
  </g>
</svg>
