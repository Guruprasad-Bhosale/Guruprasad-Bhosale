name: Generate profile metrics

on:
  schedule:
    - cron: "41 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate isometric calendar and language metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Guruprasad-Bhosale
          filename: metrics.svg
          template: classic
          base: header
          config_timezone: Asia/Kolkata
          config_order: base.header, isocalendar, languages
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          output_action: commit
          committer_branch: main
          committer_message: "chore: refresh profile metrics [skip ci]"
