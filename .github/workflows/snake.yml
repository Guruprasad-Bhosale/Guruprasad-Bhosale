name: Generate contribution snake

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Guruprasad-Bhosale
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#4BA3A3&color_dots=#151B26,#1C2635,#202C3D,#4BA3A3,#F29E85

      - name: Publish generated SVG
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
